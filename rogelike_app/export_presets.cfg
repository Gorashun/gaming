; PIPWRECK export presets. Handwritten, not editor generated: the CI runner has
; no editor session, and a hand-kept file is reviewable in a diff.
;
; Every non-obvious line is explained in docs/ANDROID.md section 3. Two rules
; before you edit:
;   1. The keystore paths stay EMPTY here. Godot reads
;      GODOT_ANDROID_KEYSTORE_{DEBUG,RELEASE}_{PATH,USER,PASSWORD} from the
;      environment and those win over the preset. A keystore must never end up
;      in the repository (.gitignore blocks *.keystore and *.jks).
;   2. "Min SDK" and "Target SDK" can only be overridden when
;      gradle_build/use_gradle_build is true. The debug preset therefore leaves
;      them empty and inherits the prebuilt template (min 24 / target 35); the
;      release preset builds with gradle and sets 24 / 36 for Google Play.

