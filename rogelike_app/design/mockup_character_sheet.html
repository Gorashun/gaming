<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIPWRECK – Character sheet</title>
<style>
@font-face{font-family:'Anton';src:url('fonts/anton-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Caveat Brush';src:url('fonts/caveatbrush-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Familjen Grotesk';src:url('fonts/familjengrotesk-var.woff2') format('woff2');font-weight:400 700;font-display:swap}
</style>
<style>
/* ===== Designtokens, UI_GUIDE §2 ===== */
:root{
  --pit:#0E1216; --slate:#161B21; --raised:#1F262E; --line:#2C353F;
  --chalk100:#F2EDE3; --chalk300:#CFC7B8; --chalk500:#9A9486;
  --bone:#E8E0CF; --pip:#12161A;
  --fire:#FF6A2C; --frost:#6ED2F5; --blood:#FF556F; --charge:#FFD447; --shield:#D7DEE6;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --r-chip:4px; --r-btn:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--pit);color:var(--chalk100);
  font-family:'Familjen Grotesk','Segoe UI',system-ui,sans-serif;display:flex;justify-content:center}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.15;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>");
  mix-blend-mode:overlay}
.app{width:100%;max-width:430px;height:100dvh;position:relative;display:flex;flex-direction:column;
  padding:0 12px 10px;background:radial-gradient(120% 55% at 50% 0%, #171D24 0%, var(--pit) 72%)}
.px{image-rendering:pixelated;image-rendering:crisp-edges;background-repeat:no-repeat;display:block}

/* ===== 1. Huvud: porträtt, namn, HP, Pips ===== */
.top{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 0 6px}
.face{width:72px;height:72px;background-size:72px 72px;flex:0 0 auto;
  border:2px solid var(--line);border-radius:8px;background-color:#11161B;
  background-image:url('../assets/sprites/hero/smith_portrait_a.png')}
.face.vb{background-image:url('../assets/sprites/hero/smith_portrait_b.png')}
.who{flex:1 1 auto;min-width:0}
.who h1{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:.05em;line-height:1}
.who .sub{font-family:'Caveat Brush',cursive;font-size:13px;color:var(--chalk500);margin-top:1px}
.bar{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;font-weight:700}
.hpbar{flex:1 1 auto;height:10px;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#0B0F13}
.hpbar i{display:block;height:100%;width:74%;background:var(--blood)}
.pips{display:flex;align-items:center;gap:4px;color:var(--charge);font-size:11px;font-weight:700;
  border:1.5px solid rgba(255,212,71,.4);border-radius:var(--r-chip);padding:2px 6px}
.closebtn{width:48px;height:48px;flex:0 0 auto;border:1.5px solid var(--line);border-radius:var(--r-btn);
  background:var(--raised);color:var(--chalk300);font:700 18px/1 'Familjen Grotesk',sans-serif}

/* ===== 2. Utrustningsrutnätet: två kolumner runt paperdollen ===== */
.gear{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:space-between;gap:6px;
  border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:8px 0}
.col{display:flex;flex-direction:column;gap:8px;flex:0 0 auto;padding:4px 0 6px}
.slot{width:58px;height:58px;position:relative;border:2px solid var(--line);border-radius:8px;
  background:#12171D;overflow:hidden}
.slot.empty{border-style:dashed;border-color:var(--chalk500);background:#0F141A}
/* Slotens bild är samma paperdoll-ark som figuren bär, zoomad ×2 och
   centrerad på plagget. Ikonen ÄR alltså pjäsen, inte en egen ikonserie. */
.slot .art{position:absolute;inset:0;background-size:768px 384px}
.slot .lbl{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:8px;font-weight:700;
  letter-spacing:.08em;color:var(--chalk300);background:rgba(10,14,18,.78);padding:2px 0 3px}
.slot.filled{border-color:#3C4956;background:radial-gradient(70% 70% at 50% 40%,#1B222A,#10151A)}
.s-helm{background-image:url('../assets/sprites/hero/smith_helm_iron.png');background-position:-21px 5px}
.s-chest{background-image:url('../assets/sprites/hero/smith_torso_broken_scale.png');background-position:-19px -23px}
.s-back{background-image:url('../assets/sprites/hero/smith_cape_ember.png');background-position:1px -31px}
.s-weap{background-image:url('../assets/sprites/hero/smith_weapon_hammer.png');background-position:-37px -11px}
.s-hands{background-image:url('../assets/sprites/hero/smith_offhand_cheat_cube.png');background-position:-7px -41px}
.s-legs{background-image:url('../assets/sprites/hero/smith_legs_iron.png');background-position:-19px -47px}

/* paperdollen i mitten: 48 px-cell i ×3 (×4 på ≥390 dp), idle-rad, alla lager */
.doll{position:relative;width:144px;height:144px;flex:0 0 auto;
  background:radial-gradient(60% 45% at 50% 78%, rgba(154,148,134,.10), transparent 70%)}
.doll .lyr{position:absolute;inset:0;width:144px;height:144px;background-size:1152px 576px;background-position:0 0}
@media (min-width:390px){
  .doll,.doll .lyr{width:192px;height:192px}
  .doll .lyr{background-size:1536px 768px}
}
.doll .cape{background-image:url('../assets/sprites/hero/smith_cape_ember.png');z-index:0}
.doll .legs{background-image:url('../assets/sprites/hero/smith_legs_iron.png');z-index:1}
.doll .body{background-image:url('../assets/sprites/hero/smith_body_a.png');z-index:2}
.doll .hair{background-image:url('../assets/sprites/hero/smith_hair_a.png');z-index:3}
.doll .torso{background-image:url('../assets/sprites/hero/smith_torso_broken_scale.png');z-index:4}
.doll .head{background-image:url('../assets/sprites/hero/smith_head_domino.png');z-index:5}
.doll .helm{background-image:url('../assets/sprites/hero/smith_helm_iron.png');z-index:6}
.doll .offh{background-image:url('../assets/sprites/hero/smith_offhand_cheat_cube.png');z-index:7}
.doll .weap{background-image:url('../assets/sprites/hero/smith_weapon_hammer.png');z-index:8}
.doll .fx{background-image:url('../assets/sprites/hero/smith_fx_blood_price.png');z-index:9}
.doll.vb .body{background-image:url('../assets/sprites/hero/smith_body_b.png')}
.doll.vb .hair{background-image:url('../assets/sprites/hero/smith_hair_b.png')}
.doll .floor{position:absolute;left:-8px;right:-8px;bottom:8px;height:2px;background:var(--chalk500);opacity:.4;filter:url(#jitter)}
.look{width:58px;height:58px;border:2px solid var(--charge);border-radius:8px;background:#161B21;
  color:var(--charge);font:700 9px/1.1 'Familjen Grotesk',sans-serif;letter-spacing:.06em;position:relative}

/* ===== 3. Slotordning (ryms bara på ≥390 dp; brädet syns alltid i striden) */
.board{flex:0 0 auto;padding:8px 0 2px}
.board .slots{display:flex;gap:6px;justify-content:space-between}
.bs{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;
  border:1.5px solid var(--line);border-radius:var(--r-chip);padding:4px 0 3px;background:#12171D}
.bs .i{width:24px;height:24px;background-size:24px 24px}
.bs b{font-size:7px;letter-spacing:.06em;color:var(--chalk500)}
@media (max-width:379px){.board{display:none}}

/* ===== 4. Tärningsraden ===== */
.dicebar{flex:0 0 auto;padding:8px 0 4px}
.capt{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;font-weight:700;
  letter-spacing:.1em;color:var(--chalk500);margin-bottom:4px}
.dice{display:flex;gap:6px;justify-content:space-between}
.die{position:relative;width:48px;height:48px;flex:0 0 auto}
.die .l{position:absolute;inset:0;width:48px;height:48px;background-size:48px 48px}
.b-iron{background-image:url('../assets/sprites/dice/die_body_iron.png')}
.b-bone{background-image:url('../assets/sprites/dice/die_body_bone.png')}
.b-glass{background-image:url('../assets/sprites/dice/die_body_glass.png')}
.die .glyph{z-index:2}
.die .rim{background-image:url('../assets/sprites/dice/glass_highlight.png');z-index:3;mix-blend-mode:screen}
.die .crack{background-image:url('../assets/sprites/dice/crack_2.png');z-index:4}
.die .tag{position:absolute;left:0;right:0;bottom:-11px;text-align:center;font-size:8px;font-weight:700;
  color:var(--chalk500);letter-spacing:.06em}

/* ===== 4. Reliker + tumzon ===== */
.relics{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:14px 0 8px}
.relics .ico{width:26px;height:26px;background-size:26px 26px}
.relics .t{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--chalk500);margin-right:2px}
.hint{font-family:'Caveat Brush',cursive;font-size:13px;color:var(--chalk500);text-align:center;padding-bottom:6px}
.golink{height:56px;border:none;border-radius:var(--r-btn);background:var(--charge);color:#12161A;
  font-family:'Anton',sans-serif;font-size:18px;letter-spacing:.06em;width:100%}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="jitter"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<div class="app">

  <!-- ===== 1. Huvud ===== -->
  <div class="top">
    <div class="face px" id="face"></div>
    <div class="who">
      <h1>SMEDEN</h1>
      <div class="sub">Kritkanten · run 7</div>
      <div class="bar">
        <span style="color:var(--blood)">74 / 100 HP</span>
        <div class="hpbar"><i></i></div>
        <span class="pips">◉ 12</span>
      </div>
    </div>
    <button class="closebtn">✕</button>
  </div>

  <!-- ===== 2. Paperdoll + utrustningsslots ===== -->
  <div class="gear">
    <div class="col">
      <div class="slot filled"><div class="art px s-helm"></div><div class="lbl">HUVUD</div></div>
      <div class="slot empty"><div class="lbl">AMULETT</div></div>
      <div class="slot filled"><div class="art px s-chest"></div><div class="lbl">BRÖST</div></div>
      <div class="slot filled"><div class="art px s-back"></div><div class="lbl">RYGG</div></div>
    </div>

    <div class="doll" id="doll">
      <div class="lyr cape px"></div>
      <div class="lyr legs px"></div>
      <div class="lyr body px"></div>
      <div class="lyr hair px"></div>
      <div class="lyr torso px"></div>
      <div class="lyr head px"></div>
      <div class="lyr helm px"></div>
      <div class="lyr offh px"></div>
      <div class="lyr weap px"></div>
      <div class="lyr fx px"></div>
      <div class="floor"></div>
    </div>

    <div class="col">
      <div class="slot filled"><div class="art px s-weap"></div><div class="lbl">VAPEN</div></div>
      <div class="slot filled"><div class="art px s-hands"></div><div class="lbl">HÄNDER</div></div>
      <div class="slot filled"><div class="art px s-legs"></div><div class="lbl">BEN</div></div>
      <button class="look" id="look">BYT<br>UTSEENDE</button>
    </div>
  </div>

  <!-- ===== 3. Slotordningen: samma bräde som striden, läs-endast ===== -->
  <div class="board">
    <div class="capt"><span>SLOTORDNING</span><span>SMEDJAN KAN ORDNA OM, ALDRIG LÄGGA TILL</span></div>
    <div class="slots">
      <div class="bs"><div class="i px" style="background-image:url('../assets/sprites/ui/slot_plain.png')"></div><b>VANLIG</b></div>
      <div class="bs"><div class="i px" style="background-image:url('../assets/sprites/ui/slot_plain.png')"></div><b>VANLIG</b></div>
      <div class="bs"><div class="i px" style="background-image:url('../assets/sprites/ui/slot_mirror.png')"></div><b>SPEGEL</b></div>
      <div class="bs"><div class="i px" style="background-image:url('../assets/sprites/ui/slot_fire.png')"></div><b>ELD</b></div>
      <div class="bs"><div class="i px" style="background-image:url('../assets/sprites/ui/slot_anvil.png')"></div><b>AMBOSS</b></div>
    </div>
  </div>

  <!-- ===== 4. Tärningsraden ===== -->
  <div class="dicebar">
    <div class="capt"><span>DINA SEX TÄRNINGAR</span><span>JÄRN ×4 · BEN ×1 · GLAS ×1</span></div>
    <div class="dice">
      <div class="die"><div class="l b-iron px"></div>
        <div class="l glyph px" style="background-image:url('../assets/sprites/dice/pips_2.png')"></div><div class="tag">2</div></div>
      <div class="die"><div class="l b-iron px"></div>
        <div class="l glyph px" style="background-image:url('../assets/sprites/dice/pips_5.png')"></div><div class="tag">5</div></div>
      <div class="die"><div class="l b-iron px"></div>
        <div class="l glyph px" style="background-image:url('../assets/sprites/dice/glyph_eld.png')"></div><div class="tag">GLÖD</div></div>
      <div class="die"><div class="l b-bone px"></div>
        <div class="l glyph px" style="background-image:url('../assets/sprites/dice/glyph_gift.png')"></div><div class="tag">GIFT</div></div>
      <div class="die"><div class="l b-iron px"></div>
        <div class="l glyph px" style="background-image:url('../assets/sprites/dice/pips_6.png')"></div><div class="tag">6</div></div>
      <div class="die"><div class="l b-glass px"></div>
        <div class="l glyph px" style="background-image:url('../assets/sprites/dice/pips_3.png')"></div>
        <div class="l rim px"></div><div class="l crack px"></div><div class="tag">SPRUCKEN</div></div>
    </div>
  </div>

  <!-- ===== 4. Reliker + tumzon ===== -->
  <div class="relics">
    <span class="t">RELIKER</span>
    <div class="ico px" style="background-image:url('../assets/sprites/items/relic_blood_price.png')" title="BLOOD_PRICE"></div>
    <div class="ico px" style="background-image:url('../assets/sprites/items/relic_cheat_cube.png')" title="CHEAT_CUBE"></div>
    <div class="ico px" style="background-image:url('../assets/sprites/items/relic_broken_scale.png')" title="BROKEN_SCALE"></div>
    <div class="ico px" style="background-image:url('../assets/sprites/items/relic_domino.png')" title="DOMINO"></div>
  </div>
  <div class="hint">Tryck på en slot för att läsa vad den gör.</div>
  <button class="golink">GÅ NER</button>

</div>
<script>
// BYT UTSEENDE växlar kropp + hår + porträtt. Gear-lagren rörs inte - det är
// hela poängen med kroppsoberoendet (PAPERDOLL §1.1).
const doll=document.getElementById('doll'), face=document.getElementById('face');
document.getElementById('look').addEventListener('click',()=>{
  doll.classList.toggle('vb'); face.classList.toggle('vb');
});
</script>
</body>
</html>
