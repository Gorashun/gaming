name: Wickwright — test & Android build

on:
  push:
    paths: ["arpg/**", ".github/workflows/arpg-android.yml"]
  pull_request:
    paths: ["arpg/**"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: arpg/game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}

      - name: Install Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -sSLf -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_TAG}_linux.x86_64 ~/godot/godot
          curl -sSLf -o /tmp/tpl.tpz https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Put Godot on PATH
        working-directory: .
        run: echo "$HOME/godot" >> $GITHUB_PATH

      - name: Import project
        run: godot --headless --import || true

      - name: Validate content
        run: |
          if [ -f tools/validate_content.py ]; then python3 tools/validate_content.py; fi

      - name: Script check
        run: |
          out=$(tools/check_scripts.sh)
          echo "$out"
          echo "$out" | grep -q "failures: 0"

      - name: Unit tests
        run: |
          if [ -f tests/run_tests.tscn ]; then timeout 300 godot --headless --path . res://tests/run_tests.tscn; fi

      - name: Configure Android SDK for Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deferred
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Export Android APK (debug, for playtesting)
        run: |
          mkdir -p export
          godot --headless --export-debug "Android" export/wickwright-debug.apk
          ls -la export

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wickwright-android-debug
          path: arpg/game/export/wickwright-debug.apk
          if-no-files-found: error
