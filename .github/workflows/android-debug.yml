name: PIPWRECK Android

# Bygger en sidoladdningsbar debug-APK av varje push som rör spelet, på alla
# grenar. Anledningen till att bygget ligger här och inte lokalt: agenternas
# container når inte dl.google.com och har därför ingen Android SDK
# (DECISIONS 2026-09-21). ubuntu-latest har både SDK och JDK förinstallerade.
#
# test.yml är orörd: den här filen lägger bara till ett bygge.

on:
  push:
    paths:
      - 'rogelike_app/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

env:
  GODOT_RELEASE: 4.6-stable
  # Katalognamnet templates packas upp i. Inte samma sträng som GODOT_RELEASE:
  # Godot letar efter "<version>.<status>", alltså 4.6.stable, inte 4.6-stable.
  GODOT_TEMPLATES_DIR: 4.6.stable
  PROJECT_DIR: rogelike_app
  # Versionerna kommer ur config.gradle i android_source.zip för 4.6 stable.
  # Ändras de där måste de ändras här.
  ANDROID_BUILD_TOOLS: 35.0.1
  ANDROID_PLATFORM: android-35
  ANDROID_NDK: 28.1.13356709

jobs:
  apk-debug:
    name: Debug APK (sideload)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Godot 4.6 kräver JDK 17 (config.gradle: javaVersion = VERSION_17).
      # apksigner körs på den här JDK:n även utan gradle-bygge.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Utan gradle-bygge behöver Godot bara två saker ur SDK:n:
      # platform-tools (adb) och build-tools (apksigner, zipalign). Ingen NDK,
      # ingen platform, ingen gradle. Det är skillnaden mellan ~1 och ~10 min.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;${{ env.ANDROID_BUILD_TOOLS }}'

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_RELEASE }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_RELEASE }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -o /tmp/godot.zip "$url"
          unzip -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      # ~1 GB. Cachen är inte en optimering utan en förutsättning: utan den
      # laddas ett gigabyte ner vid varje push.
      - name: Cache export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR }}
          key: godot-templates-${{ env.GODOT_RELEASE }}

      - name: Download export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$url"
          unzip -q -o /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates
          rm -rf "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}"
          mv /tmp/templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}"

      - name: Report versions
        run: |
          set -euo pipefail
          echo "GODOT_BIN=$HOME/godot/godot" >> "$GITHUB_ENV"
          "$HOME/godot/godot" --headless --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
          cat "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}/version.txt"

      # Skapar debug.keystore med keytool (alias androiddebugkey, lösen
      # android) och skriver ~/.config/godot/editor_settings-4.6.tres med
      # android_sdk_path, java_sdk_path och debug_keystore. Godot läser de tre
      # ur EDITOR-inställningarna, inte ur projektet eller presetet.
      - name: Write Godot editor settings and debug keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          chmod +x tools/godot_editor_settings.sh
          tools/godot_editor_settings.sh --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"

      # Första passet genererar .godot/ och registrerar alla class_name.
      - name: Import project
        working-directory: ${{ env.PROJECT_DIR }}
        run: "$GODOT_BIN --headless --import"

      - name: Export debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p build
          # Godots exit-kod är inte grinden: 4.6 kan krascha vid avslut EFTER
          # att exporten är klar och signerad (adb-shutdown utan daemon).
          # Grinden är i stället att APK:n finns, är rimligt stor och att
          # apksigner verify godkänner signaturen.
          set +e
          "$GODOT_BIN" --headless --export-debug "Android Debug" build/pipwreck-debug.apk 2>&1 | tee build/export.log
          godot_status=${PIPESTATUS[0]}
          set -e
          echo "godot exit code: ${godot_status}"
          if grep -q "Project export for preset" build/export.log; then
            echo "Godot rapporterade exportfel -- se loggen ovan" >&2
            exit 1
          fi
          test -f build/pipwreck-debug.apk
          size=$(stat -c%s build/pipwreck-debug.apk)
          if [ "$size" -lt 5000000 ]; then
            echo "APK is only ${size} bytes -- that is not a real build" >&2
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose build/pipwreck-debug.apk

      - name: Publish APK facts
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          {
            echo "## PIPWRECK debug APK"
            echo
            if [ -f build/pipwreck-debug.apk ]; then
              size=$(stat -c%s build/pipwreck-debug.apk)
              echo "| | |"
              echo "|---|---|"
              echo "| Storlek | $(numfmt --to=iec --suffix=B "$size") ($size bytes) |"
              echo "| sha256 | \`$(sha256sum build/pipwreck-debug.apk | cut -d' ' -f1)\` |"
              echo "| Paket | \`se.pipwreck.game\` |"
              echo "| Commit | \`${GITHUB_SHA}\` |"
              echo
              echo "Ladda ner artefakten **pipwreck-debug-apk** och se docs/ANDROID.md §7 för sidoladdning."
            else
              echo "Ingen APK byggdes -- se loggen för exportsteget."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipwreck-debug-apk
          path: ${{ env.PROJECT_DIR }}/build/pipwreck-debug.apk
          if-no-files-found: error
          retention-days: 30

  aab-release:
    name: Release AAB (Play)
    # Bara manuellt. En signerad release-artefakt ska aldrig falla ut ur en
    # vanlig push, och gradle-bygget tar tiofalt så lång tid.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Hemligheterna finns bara i repots Actions-secrets. Saknas de hoppar
      # jobbet över resten med en tydlig notis i stället för att falla på ett
      # kryptiskt keystore-fel. secrets går inte att läsa i ett if: på jobbnivå
      # för ett workflow_dispatch, därför kontrolleras de här.
      - name: Check for signing secrets
        id: secrets
        env:
          KEYSTORE_B64: ${{ secrets.PIPWRECK_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.PIPWRECK_KEYSTORE_USER }}
          KEYSTORE_PASS: ${{ secrets.PIPWRECK_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ] || [ -z "${KEYSTORE_USER}" ] || [ -z "${KEYSTORE_PASS}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Release-AAB hoppades över"
              echo
              echo "Hemligheterna \`PIPWRECK_KEYSTORE_BASE64\`, \`PIPWRECK_KEYSTORE_USER\`"
              echo "och \`PIPWRECK_KEYSTORE_PASS\` saknas i repots Actions-secrets."
              echo "Se docs/ANDROID.md §9 för hur keystoren skapas och läggs in."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=AAB skipped::Signing secrets are not configured; see docs/ANDROID.md section 9"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle-bygget behöver mer än debug-vägen: en platform att kompilera
      # mot (compileSdk 35 i config.gradle), cmdline-tools och den NDK-version
      # build.gradle deklarerar. AGP vägrar bygga utan exakt den NDK:n.
      - name: Set up Android SDK
        if: steps.secrets.outputs.present == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            platforms;${{ env.ANDROID_PLATFORM }}
            platforms;android-36
            ndk;${{ env.ANDROID_NDK }}

      - name: Cache Godot binary
        if: steps.secrets.outputs.present == 'true'
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_RELEASE }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_RELEASE }}
        if: steps.secrets.outputs.present == 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -o /tmp/godot.zip "$url"
          unzip -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Cache export templates
        if: steps.secrets.outputs.present == 'true'
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR }}
          key: godot-templates-${{ env.GODOT_RELEASE }}

      - name: Download export templates
        if: steps.secrets.outputs.present == 'true' && steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$url"
          unzip -q -o /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates
          rm -rf "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}"
          mv /tmp/templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}"

      # Keystoren når runnern som base64 i en secret och skrivs till en fil
      # utanför arbetskatalogen. Godot läser sedan sökväg, användare och lösen
      # ur GODOT_ANDROID_KEYSTORE_RELEASE_*, som vinner över presetets tomma
      # fält. Filen tas bort i sista steget.
      - name: Materialise release keystore
        if: steps.secrets.outputs.present == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.PIPWRECK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/pipwreck.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/signing/pipwreck.keystore" >> "$GITHUB_ENV"
          echo "GODOT_BIN=$HOME/godot/godot" >> "$GITHUB_ENV"

      - name: Write Godot editor settings
        if: steps.secrets.outputs.present == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          chmod +x tools/godot_editor_settings.sh
          tools/godot_editor_settings.sh --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"

      - name: Import project
        if: steps.secrets.outputs.present == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: "$GODOT_BIN --headless --import"

      # AAB kan bara byggas med gradle, och gradle-bygget kräver att
      # android_source.zip packats upp i projektets android/build/.
      - name: Install Android build template
        if: steps.secrets.outputs.present == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: "$GODOT_BIN --headless --install-android-build-template"

      - name: Export release AAB
        if: steps.secrets.outputs.present == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.PIPWRECK_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.PIPWRECK_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --export-release "Android Release" build/pipwreck-release.aab
          test -f build/pipwreck-release.aab

      - name: Publish AAB facts
        if: steps.secrets.outputs.present == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          size=$(stat -c%s build/pipwreck-release.aab)
          {
            echo "## PIPWRECK release AAB"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Storlek | $(numfmt --to=iec --suffix=B "$size") ($size bytes) |"
            echo "| sha256 | \`$(sha256sum build/pipwreck-release.aab | cut -d' ' -f1)\` |"
            echo "| Paket | \`se.pipwreck.game\`, target SDK 36 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipwreck-release-aab
          path: ${{ env.PROJECT_DIR }}/build/pipwreck-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Shred keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
