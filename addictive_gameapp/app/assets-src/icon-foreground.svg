<!--
  KLUNK adaptive icon, foreground layer (108 x 108 dp, transparent).
  The glass jar from the logo's "U" (rim line above, UI.md §16) holding a glowing level-0 Glimmer
  (THEME.levels[0] "Speck": #7CF9FF, face 'dot'). Everything stays inside the 66 dp safe circle
  centred on (54, 54): launchers may mask to circle, squircle or teardrop.
  Also used, scaled, for the Android 12+ splash icon and the pre-12 full-screen splash.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <radialGradient id="halo" cx="54" cy="62" r="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CF9FF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7CF9FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7CF9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="50" cy="57" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2FFFF"/>
      <stop offset="0.35" stop-color="#A8FCFF"/>
      <stop offset="0.75" stop-color="#7CF9FF"/>
      <stop offset="1" stop-color="#2AB7CB"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223C" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#16223C" stop-opacity="0.70"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- glass -->
  <path d="M35 40 V65 A11 11 0 0 0 46 76 H62 A11 11 0 0 0 73 65 V40 Z" fill="url(#glass)"/>
  <!-- glow spilling through the glass -->
  <circle cx="54" cy="62" r="27" fill="url(#halo)"/>

  <!-- the Glimmer -->
  <circle cx="54" cy="62" r="12.5" fill="#7CF9FF" filter="url(#blur)" opacity="0.9"/>
  <circle cx="54" cy="62" r="12" fill="url(#body)"/>
  <ellipse cx="49.2" cy="56.6" rx="3.6" ry="2.2" fill="#FFFFFF" opacity="0.75" transform="rotate(-32 49.2 56.6)"/>
  <circle cx="50.3" cy="62" r="1.8" fill="#14202E"/>
  <circle cx="57.7" cy="62" r="1.8" fill="#14202E"/>
  <circle cx="50.8" cy="61.4" r="0.55" fill="#FFFFFF"/>
  <circle cx="58.2" cy="61.4" r="0.55" fill="#FFFFFF"/>
  <path d="M52 66 Q54 67.8 56 66" fill="none" stroke="#14202E" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="47.6" cy="65.4" r="1.3" fill="#FF5FA2" opacity="0.45"/>
  <circle cx="60.4" cy="65.4" r="1.3" fill="#FF5FA2" opacity="0.45"/>

  <!-- rising bubbles -->
  <g fill="none" stroke="#7CF9FF" stroke-width="0.8">
    <circle cx="64.5" cy="48" r="1.6" opacity="0.7"/>
    <circle cx="61" cy="43" r="1.0" opacity="0.5"/>
  </g>

  <!-- jar wall: the logo's U -->
  <path d="M35 40 V65 A11 11 0 0 0 46 76 H62 A11 11 0 0 0 73 65 V40" fill="none" stroke="#EAF2FF" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- glass shine -->
  <path d="M40 45 V58" stroke="#AFC8FF" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round"/>
  <!-- rim line -->
  <path d="M33 34 H75" stroke="#7CF9FF" stroke-width="4.2" stroke-linecap="round"/>
</svg>
